<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F1E3D">
  <title>KDRT ExamSphere</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="splash" id="splash">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <i class="bi bi-journal-check float-icon" style="top:14%;left:12%"></i>
    <i class="bi bi-award float-icon" style="top:22%;right:14%;animation-delay:-2s"></i>
    <i class="bi bi-lightbulb float-icon" style="bottom:18%;left:18%;animation-delay:-3s"></i>
    <i class="bi bi-graph-up-arrow float-icon" style="bottom:22%;right:20%;animation-delay:-1s"></i>
    <div class="splash-inner">
      <svg class="exam-art" viewBox="0 0 320 260" aria-hidden="true">
        <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
        <g class="sheet"><rect x="40" y="20" width="170" height="220" rx="14" fill="#fff" opacity=".97"/>
          <rect x="62" y="44" width="90" height="10" rx="5" fill="#115e59" opacity=".85"/><rect x="62" y="62" width="60" height="7" rx="3.5" fill="#5eead4"/>
          <g fill="none" stroke-width="3" stroke-linecap="round">
            <circle cx="72" cy="100" r="9" stroke="#99f6e4"/><path class="tick t1" d="M66 100l5 5 9-11" stroke="#16a34a"/><rect x="92" y="96" width="92" height="8" rx="4" fill="#ccfbf1" stroke="none"/>
            <circle cx="72" cy="135" r="9" stroke="#99f6e4"/><path class="tick t2" d="M66 135l5 5 9-11" stroke="#16a34a"/><rect x="92" y="131" width="80" height="8" rx="4" fill="#ccfbf1" stroke="none"/>
            <circle cx="72" cy="170" r="9" stroke="#99f6e4"/><path class="tick t3" d="M66 170l5 5 9-11" stroke="#16a34a"/><rect x="92" y="166" width="96" height="8" rx="4" fill="#ccfbf1" stroke="none"/>
            <circle cx="72" cy="205" r="9" stroke="#99f6e4"/><path class="tick t4" d="M66 205l5 5 9-11" stroke="#16a34a"/><rect x="92" y="201" width="70" height="8" rx="4" fill="#ccfbf1" stroke="none"/></g></g>
        <g class="pencil"><rect x="0" y="-6" width="86" height="12" rx="2" fill="url(#pg)" transform="rotate(-38)"/><path d="M-2 -6 L-14 0 L-2 6Z" fill="#1e293b" transform="rotate(-38)"/></g>
        <g class="clock" transform="translate(255 70)"><circle r="40" fill="#fff" stroke="#fbbf24" stroke-width="5"/><circle r="3.5" fill="#115e59"/>
          <line class="hand-m" x1="0" y1="0" x2="0" y2="-28" stroke="#115e59" stroke-width="4" stroke-linecap="round"/><line class="hand-h" x1="0" y1="0" x2="16" y2="0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/></g>
        <g transform="translate(262 185)"><g class="medal"><path d="M-12 -38 L0 -14 L12 -38" fill="#0d9488"/><circle r="22" fill="#fbbf24"/><polygon points="0,-11 3.2,-3.4 10.5,-3.4 4.6,1.3 6.8,8.9 0,4.4 -6.8,8.9 -4.6,1.3 -10.5,-3.4 -3.2,-3.4" fill="#fff"/></g></g>
      </svg>
      <div class="splash-logo"><i class="bi bi-mortarboard-fill"></i></div>
      <h1 id="appName">KDRT ExamSphere</h1>
      <p class="lead mb-0">Online Examination &amp; Learning Portal</p>
      <p class="splash-tags mb-0"><span>JEE</span><span>NEET</span><span>Boards</span><span>Semester</span></p>
      <div class="splash-bar"><span></span></div>
      <small id="splashStatus">Getting things ready…</small>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      var C = window.APP_CONFIG || {};
      document.getElementById("appName").textContent = C.APP_NAME || "KDRT ExamSphere";
      document.title = C.APP_NAME || "KDRT ExamSphere";
      var status = document.getElementById("splashStatus");
      var started = Date.now(), target = "login.html";
      var check = window.API && API.token
        ? API.call("auth.me", {}, { noRedirect: true }).then(function () { target = "pages/dashboard.html"; status.textContent = "Welcome back!"; }).catch(function () { API.clear(); })
        : Promise.resolve();
      check.then(function () {
        setTimeout(function () {
          document.getElementById("splash").classList.add("hide");
          setTimeout(function () { location.replace(target); }, 450);
        }, Math.max(0, 2600 - (Date.now() - started)));
      });
    })();
  </script>
</body>
</html>
